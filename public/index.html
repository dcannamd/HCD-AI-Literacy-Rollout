<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Literacy Rollout Planner</title>
  <meta name="description" content="A free, human-centered planner for rolling out AI literacy at work.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">Free and open source</p>
      <h1>AI Literacy Rollout Planner</h1>
      <p class="lead">Roll out AI literacy the human-centered way: bring people in first, practise safely, and measure what matters.</p>
    </header>

    <section aria-labelledby="steps-heading">
      <h2 id="steps-heading">The steps</h2>
      <ol id="modules" class="cards"></ol>
    </section>

    <footer>
      <p>Built by <a href="https://www.danacannam.com">Dana Cannam</a>. Phase 1 preview.</p>
    </footer>
  </main>

  <script>
    fetch('/modules.json')
      .then((r) => r.json())
      .then((modules) => {
        const list = document.getElementById('modules');
        modules.forEach((m) => {
          const li = document.createElement('li');
          li.className = 'card';
          const a = document.createElement('a');
          a.href = '/' + m.slug;
          const step = document.createElement('span');
          step.className = 'step';
          step.textContent = m.step;
          const h3 = document.createElement('h3');
          h3.textContent = m.title;
          const p = document.createElement('p');
          p.textContent = m.summary;
          a.append(step, h3, p);
          li.append(a);
          list.append(li);
        });
      });
  </script>
</body>
</html>
